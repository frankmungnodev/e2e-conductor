    <p class="eyebrow">Worked example · scenario + config</p>
    <h1>How a scenario finds its config</h1><p class="note">Every link is a plain string key. <code>setup</code> names a fixture, <code>target</code> names a target (or the built-in <code>"shell"</code>), and a target's <code>service</code> names a service. <code>run</code> and <code>flow</code> are file names inside the target's <code>modules</code> or <code>flows</code> folder.</p>
